name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-experts-core
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, experts-core]
    timeout-minutes: 20
    steps:
      - name: Run deploy script
        shell: powershell
        run: C:\deploy\deploy-experts-core.ps1

      # Cada `docker compose up --build` deja capas en la caché de build (llegó a
      # 22 GB en el disco de la PC). Se borra lo que no se usó en 7 días: el
      # próximo build sigue usando la caché reciente.
      - name: Limpiar caché de build de Docker
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          docker builder prune -f --filter "until=168h"
          docker system df
